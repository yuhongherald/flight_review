services:
  flight_review_app:
    # Pinned, never `:latest` alone — a dated tag is a rollback target. `docker compose pull`
    # resolves this line, so bumping the image means bumping it here too.
    image: yuhongherald/px4-flight-review:20260816
    # Kept alongside `image:` on purpose: `up` builds only when the image is absent, `pull`
    # still fetches the pinned tag, `up --build` forces a rebuild, and CI's
    # `docker compose build` has something to build.
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: px4-flight-review
    restart: unless-stopped
    ports:
      - "${PORT:-5006}:5006"
    env_file: .env
    volumes:
      # Must be /opt/data, not /opt/service/data: config_default.ini's `storage_path = ../data`
      # is relative to /opt/service, so the app writes one level up. Mounting the wrong path
      # leaves this empty and silently makes all log history ephemeral.
      - ./data:/opt/data
      # Operator overrides (config_default.ini's keys). Left commented because
      # app/config_user.ini is gitignored, and binding a file that does not exist makes Docker
      # create a directory in its place — create the file first, then uncomment.
      # - ./app/config_user.ini:/opt/service/config_user.ini:ro
